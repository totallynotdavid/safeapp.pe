version: 2

# Grouping is the point here. Ungrouped, a weekly run on three ecosystems opens
# a dozen PRs that all say the same thing. Patch and minor releases arrive as one
# PR per ecosystem, which CI either passes or does not. Majors stay separate
# because each one needs its upgrade guide read.
#
# Note this runs against the default branch, not against whichever branch the
# rewrite is currently on.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ["*"]
