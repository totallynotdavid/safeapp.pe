name: CI

on:
  push:
    branches: [master, migration]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Format, lint, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ext-zip is named explicitly because every spreadsheet export fails at
      # runtime without it. The versions here duplicate mise.toml; nothing
      # checks that the two agree.
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.8"
          extensions: zip
          coverage: none

      - name: Install Mago
        uses: nhedger/setup-mago@v2
        with:
          version: "1.44.0"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      # artisan boots before any test runs, and it needs an APP_KEY to do it.
      # The database settings in .env.example are unused: phpunit.xml points
      # the suite at an in-memory SQLite connection.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: make fmt-check
      - run: make lint
      - run: make test

  assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # --frozen-lockfile is bun's npm ci: it fails rather than resolving when
      # bun.lock and package.json disagree.
      - run: bun install --frozen-lockfile
      - run: bun run build
