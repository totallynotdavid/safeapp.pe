name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Format, lint, analyze, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # mise.toml is the only place a tool version is written. The same
      # prebuilt PHP, Composer, Mago and Bun that `make setup` installs run
      # here, and tests/Unit/ToolchainPinsTest.php rejects a workflow that pins
      # a version of its own.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      # artisan boots before any test runs, and it needs an APP_KEY to do it.
      # The database settings in .env.example are unused: phpunit.xml points
      # the suite at an in-memory SQLite connection.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: make fmt-check
      - run: make lint
      - run: make analyze
      - run: make test

  assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # --frozen-lockfile is bun's npm ci: it fails rather than resolving when
      # bun.lock and package.json disagree.
      - run: bun install --frozen-lockfile
      - run: bun run build
