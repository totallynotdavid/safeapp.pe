name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml is the only place a tool version is written. Do not pin one
      # in this workflow.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      # --frozen-lockfile is bun's npm ci: it fails rather than resolving when
      # bun.lock and package.json disagree.
      - run: bun install --frozen-lockfile

      # artisan boots before any test runs, and it needs an APP_KEY to do it.
      # The database settings in .env.example are unused: phpunit.xml points
      # the suite at an in-memory SQLite connection.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: bun run check
