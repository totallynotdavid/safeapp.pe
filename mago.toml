#:schema https://mago.carthage.software/1.43.0/schema.json

php-version = "8.2"

[source]
paths = ["app", "config", "database", "routes", "tests"]
includes = ["vendor"]

[formatter]
preset = "laravel"

[linter]
integrations = ["laravel", "phpunit"]

[linter.rules]
# Laravel's own code omits declare(strict_types=1). Matching the framework
# convention beats fighting it on every file.
strict-types = { enabled = false }
# Laravel controllers extend a shared base and are not final by convention.
final-controller = { enabled = false }
# Positional literals read fine in Laravel's fluent builders (schema columns,
# validation rules). Named-argument nudges are noise here.
literal-named-argument = { enabled = false }
# Our PHPUnit assertions follow a deliberate, consistent style already.
assertion-style = { enabled = false }
# Eloquent models spend most of their method count on one-liner relationship
# accessors (Usuario's rol, menus, asignaciones, ...), and PHPUnit feature
# tests spend theirs on one method per CRUD/permission scenario for a screen.
# Both track framework/test shape, not unrelated concerns piling up.
too-many-methods = { exclude = ["app/Models/*.php", "tests/**/*.php"] }
