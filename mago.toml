#:schema https://mago.carthage.software/1.43.0/schema.json

php-version = "8.2"

[source]
paths = ["app", "config", "database", "routes", "tests"]
includes = ["vendor"]

[formatter]
preset = "laravel"

[analyzer]
# Unknown methods and properties are reported as warnings. The default level
# would let them pass the gate.
minimum-fail-level = "warning"
ignore = [
    # DB::table() rows are stdClass, so their columns have no declaration. Only
    # the files that read such rows are listed.
    { code = "ambiguous-object-property-access", in = ["app/Cutover/", "app/Cockpit/MezclaDeLineas.php", "app/Http/Controllers/ProduccionController.php", "app/Support/BackfillDeAccesosClientes.php"] },
    # Laravel reads these arguments through func_get_args(). The methods accept
    # more arguments at runtime than their declared signatures show.
    { code = "too-many-arguments", pattern = "Eloquent.Builder::with`|Eloquent.Model::load`|Query.Builder::select`" },
    # Factory::create() may return a model or a collection because count()
    # changes the result. The analyzer cannot infer the single-model case in
    # tests. It also cannot prove that find() and fresh() are non-null there.
    # The columns and methods read off those results are listed by name, so a
    # mistyped one still fails.
    { code = "non-documented-property", pattern = "property access: \\$(agente|asignacionActiva|caso_sf|clave|cliente|comentario_back|comentario_validador|contacto|contacto1|contrata|correo|correo_verificado_en|estado|fecha_actualizacion|fecha_liberacion|fecha_nacimiento|fecha_validacion|id_back|id_cartera|id_cliente|id_dato|id_menu|id_rol|id_supervisor|id_tienda|id_usuario|id_validador|nombre_contacto|nombre_rol|origen|personal|q_entel|q_lineas|q_movistar|razon_social|respuesta|ruc|telefono|tipo_data|validacion|zonal) on class `Illuminate.Database.Eloquent.(Collection|Model)`", in = ["tests/", "database/"] },
    { code = "non-documented-method", pattern = "call to `(?i:accesos|can|getAttributes|menus|refresh|sincronizarAsignaciones|tiendaAsignada)` on class `Illuminate.Database.Eloquent.Collection`", in = ["tests/", "database/"] },
    { code = "non-documented-method", pattern = "call to `(?i:map|pluck)` on class `App.Models.Menu`", in = ["tests/", "database/"] },
    { code = "possibly-invalid-argument", pattern = "Eloquent.Collection<int, App.Models", in = ["tests/"] },
    { code = "invalid-return-statement", pattern = "Eloquent.Collection<int, App.Models", in = ["tests/"] },
    { code = "invalid-property-assignment-value", pattern = "Eloquent.Collection<int, App.Models", in = ["tests/"] },
    { code = "possibly-null-property-access", in = ["tests/"] },
    { code = "possible-method-access-on-null", in = ["tests/"] },
]

[linter]
integrations = ["laravel", "phpunit"]
# Warnings fail the run, so "no warnings" is the standard, not a hope.
minimum-fail-level = "warning"

[linter.rules]
# Laravel's own code omits declare(strict_types=1). Matching the framework
# convention beats fighting it on every file.
strict-types = { enabled = false }
# Laravel controllers extend a shared base and are not final by convention.
final-controller = { enabled = false }
# Positional literals read fine in Laravel's fluent builders (schema columns,
# validation rules). Named-argument nudges are noise here.
literal-named-argument = { enabled = false }
# Our PHPUnit assertions follow a deliberate, consistent style already.
assertion-style = { enabled = false }
# Eloquent models spend most of their method count on one-liner relationship
# accessors (Usuario's rol, menus, asignaciones, ...), and PHPUnit feature
# tests spend theirs on one method per CRUD/permission scenario for a screen.
# Both track framework/test shape, not unrelated concerns piling up.
too-many-methods = { exclude = ["app/Models/*.php", "tests/**/*.php"] }
